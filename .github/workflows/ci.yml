name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: typecheck, lint, tests e build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://kotoba:kotoba_dev_password@localhost:5432/kotoba

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kotoba
          POSTGRES_USER: kotoba
          POSTGRES_PASSWORD: kotoba_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotoba -d kotoba"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm install

      - name: Aplicar migrações
        run: npm run db:migrate

      - name: Semear banco de dados
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
